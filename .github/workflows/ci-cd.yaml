name: CI/CD

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  push:
    branches: ['main']
    # Publish semver tags as releases.
    tags: ['v*.*.*']
  pull_request:
    branches: ['main']

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}
  FOLDER_NAME: ${{ github.event.repository.name }}-fc3-codeflix-backend-admin-catalogo-de-videos

jobs:
  ci:
    runs-on: ubuntu-latest
    # gerado no step Bump version and push tag
    outputs:
      new_version: ${{ steps.tagging.outputs.new_tag }}
    permissions:
      # contents: write: permite ao workflow criar, modificar ou apagar arquivos do repositório (por exemplo, criar releases, fazer commits, ou tags).
      contents: write
      # packages: write: permite ao workflow publicar, modificar ou apagar pacotes (por exemplo, enviar imagens Docker ou outros artefatos para o GitHub Packages).
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      # o sigstore/cosign usa o serviço id-token do GitHub Actions para obter um token OIDC, que é apresentado ao Fulcio para autenticar e receber um certificado temporário para assinar a imagem.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # Install the cosign tool except on PR
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6e04d228eb30da1757ee4e1dd75a0ec73a653e06 #v3.1.1
        with:
          cosign-release: 'v2.1.1'

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build development
        id: build-and-push
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          push: false
          # como estava na aula, precisei mudar isos pois coloquei os arquivos docker em uma pasta diferente da do professor
          #tags: ${{ env.FOLDER_NAME }}
          tags: docker-fc3-codeflix-backend-admin-catalogo-de-videos
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # permiti usar no proximo step
          # carrega a iamgem no docker local
          load: true
          file: docker/Dockerfile.prod
          target: development

      - name: up containers
        env:
          GOOGLE_CLOUD_CREDENTIALS: ${{ secrets.GOOGLE_CLOUD_CREDENTIALS }}
          GOOGLE_CLOUD_STORAGE_BUCKET_NAME: ${{ secrets.GOOGLE_CLOUD_STORAGE_BUCKET_NAME }}
        run: docker compose -f docker/docker-compose.ci.yaml up -d

      - name: wait for mysql
        run: docker compose -f docker/docker-compose.ci.yaml exec -T db-fc3-codeflix-backend-admin-catalogo-de-videos mysqladmin ping --silent --wait=30 -uroot -proot

      - name: generate envs
        run: |
          docker compose -f docker/docker-compose.ci.yaml exec -u root -T fc3-codeflix-backend-admin-catalogo-de-videos cp ./envs/.env.test.example ./envs/.env.test
          docker compose -f docker/docker-compose.ci.yaml exec -u root -T fc3-codeflix-backend-admin-catalogo-de-videos cp ./envs/.env.e2e.example ./envs/.env.e2e

      - name: Show env files content
        run: |
          docker compose -f docker/docker-compose.ci.yaml exec -T fc3-codeflix-backend-admin-catalogo-de-videos cat ./envs/.env.test
          docker compose -f docker/docker-compose.ci.yaml exec -T fc3-codeflix-backend-admin-catalogo-de-videos cat ./envs/.env.e2e
     
      - name: Check environment variables
        run: |
          docker compose -f docker/docker-compose.ci.yaml exec -T fc3-codeflix-backend-admin-catalogo-de-videos sh -c '
            if [ -n "$GOOGLE_CLOUD_CREDENTIALS" ]; then
              echo "GOOGLE_CLOUD_CREDENTIALS: presente"
            else
              echo "GOOGLE_CLOUD_CREDENTIALS: vazia"
            fi

            if [ -n "$GOOGLE_CLOUD_STORAGE_BUCKET_NAME" ]; then
              echo "GOOGLE_CLOUD_STORAGE_BUCKET_NAME: presente"
            else
              echo "GOOGLE_CLOUD_STORAGE_BUCKET_NAME: vazia"
            fi
          '

      - name: run unit and integration tests
        run: docker compose -f docker/docker-compose.ci.yaml exec -T fc3-codeflix-backend-admin-catalogo-de-videos npm run test

      - name: run e2e tests
        run: docker compose -f docker/docker-compose.ci.yaml exec -T fc3-codeflix-backend-admin-catalogo-de-videos npm run test:e2e -- --runInBand --detectOpenHandles --forceExit
      
      - name: Generate error intentionally
        run: exit 1
 

      # cria uma nova tag no repositorio, semver
      - name: Bump version and push tag
        id: tagging
        if: github.event_name != 'pull_request'
        uses: mathieudutour/github-tag-action@v6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # 
      - name: Build prod version and push
        id: build-final
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tagging.outputs.new_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: docker/Dockerfile.prod

  cd:
    needs: ci
    runs-on: ubuntu-latest

    if: ${{ github.event_name != 'pull_request' }}

    steps:
      - name: show version
        run: echo ${{ needs.ci.outputs.new_version }}