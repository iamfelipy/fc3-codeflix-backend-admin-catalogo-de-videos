services:
  fc3-codeflix-backend-admin-catalogo-de-videos:
    # O . em build: . é relativo ao local onde está o arquivo docker-compose.yml, não ao terminal.
    build: 
      context: ..
      dockerfile: docker/Dockerfile
    # esse arquivo precisa da permissão chmod a+x .docker/start.sh
    command: docker/.docker/start.sh
    ports:
      - 3000:3000
    # relativo ao docker compose
    volumes:
      - ../:/home/node/app

      # Persistência do Codex (Sua configuração atual)
      - fc3_codex_data:/home/node/.codex
      # 1. PERSISTÊNCIA DO GEMINI CLI (Salva histórico do chat e políticas locais)
      - fc3_gemini_data:/home/node/.gemini
      # 2. PERSISTÊNCIA GLOBAL DE CONFIGURAÇÕES NODE (Caso o Gemini CLI use o escopo geral do NPM)
      - fc3_node_config:/home/node/.config
      # 3. CACHE DO UV (Opcional, mas evita que ele baixe o Python 3.11 toda vez que reconstruir)
      - fc3_uv_cache:/home/node/.cache/uv

      # Por padrão, o container não vem com o horário/fuso do host configurado corretamente.
      # Essas linhas sincronizam o horário do container com o host, evitando erro de expiração de JWT no SDK do Google Cloud por diferença de fuso horário.
      # OBS: Funciona apenas em ambientes Linux. No Windows seria preciso outra configuração para timezone, pois esses arquivos não existem.
      - '/etc/timezone:/etc/timezone:ro'
      - '/etc/localtime:/etc/localtime:ro'
    extra_hosts:
      # host.docker.internal é um nome DNS especial usado por containers Docker para acessar a máquina host (funciona nativamente no Docker Desktop/Windows/Mac).
      # host-gateway instrui o Docker a resolver o IP real do gateway do host (ou seja, a rede do host) ― funciona também em ambientes Linux nativos a partir do Docker 20.10.
      # Juntos (host.docker.internal:host-gateway), garantem compatibilidade entre sistemas, mapeando o nome para o IP do host.
      - "host.docker.internal:host-gateway"
    labels:
      filebeat_collector: true
    depends_on:
      - db-fc3-codeflix-backend-admin-catalogo-de-videos
      - fc3-codeflix-rabbitmq

  
  db-fc3-codeflix-backend-admin-catalogo-de-videos:
    image: mysql:8.0.30-debian
    environment:
      - MYSQL_DATABASE=micro_videos
      - MYSQL_ROOT_PASSWORD=root
    # volumes:
    # - ./.docker/mysql:/docker-entrypoint-initdb.d
    tmpfs:
      - /var/lib/mysql
    security_opt:
      - seccomp:unconfined
  fc3-codeflix-rabbitmq:
    build: .docker/rabbitmq
    ports:
      # porta da interface web exposta para o host
      - 15672:15672
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    #volumes:
      # consigo salvar os dados das filas
      #- ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
      #- ./rabbitmq_data:/var/lib/rabbitmq
    #tmpfs:
      #- /var/lib/rabbitmq
      #- /etc/rabbitmq

volumes:
  fc3_codex_data:
  fc3_gemini_data:
  fc3_node_config:
  fc3_uv_cache: