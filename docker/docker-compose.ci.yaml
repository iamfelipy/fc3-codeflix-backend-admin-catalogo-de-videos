

services:
  
  fc3-codeflix-backend-admin-catalogo-de-videos:
    build: 
      context: ..
      dockerfile: docker/Dockerfile.prod
    restart: on-failure
    ports:
      - 3000:3000
    volumes:
      - '/etc/timezone:/etc/timezone:ro'
      - '/etc/localtime:/etc/localtime:ro'
      - ../envs:/home/node/app/envs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db-fc3-codeflix-backend-admin-catalogo-de-videos
      - fc3-codeflix-rabbitmq

  db-fc3-codeflix-backend-admin-catalogo-de-videos:
    image: mysql:8.0.30-debian
    environment:
      - MYSQL_DATABASE=micro_videos
      - MYSQL_ROOT_PASSWORD=root
    tmpfs:
      - /var/lib/mysql
    security_opt:
      - seccomp:unconfined
  
  fc3-codeflix-rabbitmq:
    build: .docker/rabbitmq
    ports:
      - 15672:15672
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    tmpfs:
      - /var/lib/rabbitmq